<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON AIR</title>
<link rel="icon" href="/icon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="tiles" id="tiles"></div>

  <header class="top">
    <div class="slug" id="slug">voice.synth · claude · breeze.tts</div>
    <div class="onair">
      <span class="dot"></span>
      <span id="title">ON AIR · INTERVIEW Nº 01</span>
    </div>
    <div class="chip" id="chip" hidden>配置未填</div>
  </header>

  <button class="fsbtn" id="fsbtn" aria-label="全屏" title="全屏">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
    </svg>
  </button>

  <button class="gear" id="gear" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
    </svg>
  </button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheethead">
      <span class="label">SETTINGS</span>
      <button class="sheetclose" id="sheetclose" aria-label="关闭">×</button>
    </div>
    <form id="settingsform" autocomplete="off">
      <div class="field">
        <label for="cfgBaseUrl">大脑接口</label>
        <input id="cfgBaseUrl" placeholder="https://api.deepseek.com/anthropic">
      </div>
      <div class="field">
        <label for="cfgBrainKey">大脑 Key</label>
        <input id="cfgBrainKey" type="password" placeholder="留空表示不修改">
      </div>
      <div class="field">
        <label for="cfgModel">模型</label>
        <input id="cfgModel" placeholder="deepseek-flash">
      </div>
      <div class="field">
        <label for="cfgVoiceKey">BreezeBlue Key</label>
        <input id="cfgVoiceKey" type="password" placeholder="brz_...">
      </div>
      <div class="field">
        <label for="cfgVoiceId">音色 ID</label>
        <input id="cfgVoiceId" placeholder="voc_...">
      </div>
      <div class="field">
        <label for="cfgProxy">语音代理</label>
        <input id="cfgProxy" placeholder="留空 = 直连">
      </div>
      <div class="sheetactions">
        <button type="button" id="testvoice">试听 voice（约 1 credit）</button>
        <button type="submit" id="savesettings">保存</button>
      </div>
      <div class="sheetmsg" id="sheetmsg"></div>
      <div class="sheetfoot">
        <span>改完保存即生效，不用重启</span>
        <button type="button" id="quitapp">退出应用</button>
      </div>
    </form>
  </div>

  <section class="qblock">
    <div class="label">INTERVIEWER</div>
    <div class="qline">
      <span class="qmark">Q:</span>
      <span class="qtext" id="qtext"></span>
    </div>
    <div class="qen" id="qen"></div>
    <div class="rule"></div>
  </section>

  <section class="orbwrap">
    <canvas id="orb"></canvas>
  </section>

  <section class="answer" id="answer">
    <div class="stack" id="stack"></div>
  </section>

  <footer class="bottom">
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span class="t" id="t-left">0:00</span>
      <span class="state" id="state">listening</span>
      <span class="t" id="t-right">0:00</span>
    </div>
    <form class="ask" id="ask" autocomplete="off">
      <span class="caret">›</span>
      <input id="input" placeholder="用中文提问，回车发送" autocomplete="off" spellcheck="false">
    </form>
    <div class="notice" id="notice"></div>
  </footer>
</div>
<script src="/puzzle-bg.js"></script>
<script src="/app.js"></script>
</body>
</html>
